default:
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - pip install hatch

stages:
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GIT_DEPTH: 0 # Récupère tous les tags et l'historique Git pour hatch-vcs
  USER: "bprisset"

cache:
  paths:
    - .cache/pip

unit-tests:
  stage: test
  script:
    - hatch test --cover
  coverage: '/TOTAL.*\s+(\d+%)$/'

deploy-stable:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - hatch build
    - echo "my-arithmetic-$USER deployment on stable servers"
    - ls -la dist/
  artifacts:
    paths:
      - dist/

deploy-develop:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  script:
    - hatch build
    - echo "my-arithmetic-$USER deployment on develop servers"
    - ls -la dist/
  artifacts:
    paths:
      - dist/
