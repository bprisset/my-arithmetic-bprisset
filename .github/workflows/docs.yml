name: Documentation

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  docs:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs-requirements.txt
          pip install .

      - name: Build HTML documentation with Sphinx
        run: sphinx-build -b html . _build/html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-html-docs
          path: _build/html

      - name: Trigger Read the Docs Build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RTD_WEBHOOK_URL: ${{ secrets.RTD_WEBHOOK_URL }}
          RTD_WEBHOOK_TOKEN: ${{ secrets.RTD_WEBHOOK_TOKEN }}
        run: |
          if [ -n "$RTD_WEBHOOK_URL" ]; then
            echo "Triggering Read the Docs build via webhook..."
            curl -X POST -d "branches=${{ github.ref_name }}" -d "token=$RTD_WEBHOOK_TOKEN" "$RTD_WEBHOOK_URL"
          else
            echo "RTD_WEBHOOK_URL non configuré. Le déploiement Read the Docs s'effectue via l'intégration native GitHub (.readthedocs.yaml)."
          fi
