name: Deploy

on:
  push:
    branches:
      - develop
    tags:
      - '*'

jobs:
  deploy-develop:
    name: Deploy to Develop Servers
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      USER: "bprisset"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Build package
        run: hatch build

      - name: Deploy on develop servers
        run: |
          echo "my-arithmetic-$USER deployment on develop servers"
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-develop
          path: dist/

  deploy-stable:
    name: Deploy to Stable Servers
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      USER: "bprisset"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Hatch
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Build package
        run: hatch build

      - name: Deploy on stable servers
        run: |
          echo "my-arithmetic-$USER deployment on stable servers"
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-stable
          path: dist/
