[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my-arithmetic-bprisset"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Baptiste Prisset", email = "baptiste.prisset@etudiant.univ-lr.fr" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/Baptiste Prisset/my-arithmetic-bprisset#readme"
Issues = "https://github.com/Baptiste Prisset/my-arithmetic-bprisset/issues"
Source = "https://github.com/Baptiste Prisset/my-arithmetic-bprisset"

[tool.hatch.version]
path = "src/my_arithmetic_bprisset/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
  "pytest",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/my_arithmetic_bprisset tests}"

[tool.coverage.run]
source_pkgs = ["my_arithmetic_bprisset", "tests"]
branch = true
parallel = true
omit = [
  "src/my_arithmetic_bprisset/__about__.py",
]

[tool.coverage.paths]
my_arithmetic_bprisset = ["src/my_arithmetic_bprisset", "*/my-arithmetic-bprisset/src/my_arithmetic_bprisset"]
tests = ["tests", "*/my-arithmetic-bprisset/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

